version: '3.8'

services:
  ocr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-di-llm-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - LLM_TEMPERATURE=0
      - LLM_TOP_P=0.8
      - LLM_TIMEOUT_MS=120000
      - LLM_MAX_RETRIES=2
      - LLM_THINKING=false
      - PROMPT_VERSION=transcript.v1
    depends_on:
      - ollama
    networks:
      - ocr-network

  ollama:
    image: ollama/ollama:latest
    container_name: ocr-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ocr-network

volumes:
  ollama-models:

networks:
  ocr-network:
    driver: bridge
